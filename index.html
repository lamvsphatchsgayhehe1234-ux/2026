<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kỷ niệm 2026</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a12;
            --card-bg: rgba(20, 20, 35, 0.7);
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --text-color: #e0e5ff;
            --text-dim: #8a8fbd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 243, 255, 0.1);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            letter-spacing: 2px;
        }

        .nav-admin-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .nav-admin-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* --- MODAL ĐĂNG NHẬP ADMIN --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .login-box {
            background: #121220;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(157, 0, 255, 0.4);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            position: relative;
        }

        .login-box h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-purple);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .close-modal:hover { color: #fff; }

        /* --- VÙNG ADMIN UPLOAD (ẨN MẶC ĐỊNH) --- */
        .admin-panel {
            display: none; /* Mặc định ẩn, đăng nhập mới hiện */
            background: var(--card-bg);
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.25);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-dim);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(10, 10, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
        }

        /* --- LƯỚI KỶ NIỆM (GALLERY) --- */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .memory-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .memory-card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-blue);
            box-shadow: 0 12px 30px rgba(0, 243, 255, 0.25);
        }

        .media-box {
            width: 100%;
            height: 230px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .media-box img, .media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .memory-content {
            padding: 18px;
        }

        .memory-caption {
            font-size: 1.1rem;
            line-height: 1.4;
            color: #fff;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .memory-date {
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Nút xóa kỷ niệm (Chỉ hiện khi Admin đã Đăng nhập) */
        .btn-delete {
            display: none;
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(255, 0, 85, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px; height: 35px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .btn-delete:hover {
            background: var(--neon-pink);
            transform: scale(1.1);
        }

        body.is-admin .btn-delete {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 1.2rem;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- HEADER MENU -->
    <header>
        <div class="logo"><i class="fa-solid fa-bolt"></i>2026</div>
        <button class="nav-admin-btn" id="authBtn" onclick="toggleAuth()"><i class="fa-solid fa-lock"></i> Admin</button>
    </header>

    <div class="container">
        <!-- FORM CONTROL ADMIN UPLOAD -->
        <div class="admin-panel" id="adminPanel">
            <h2><i class="fa-solid fa-cloud-arrow-up"></i> TẢI KỶ NIỆM MỚI (ADMIN)</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label><i class="fa-regular fa-image"></i> Chọn Ảnh hoặc Video:</label>
                    <input type="file" id="mediaFile" accept="image/*,video/*" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-regular fa-comment-dots"></i> Lời nhắn kỷ niệm:</label>
                    <textarea id="caption" rows="3" placeholder="Ghi chú khoảnh khắc đáng nhớ..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">LƯU KỶ NIỆM</button>
            </form>
        </div>

        <!-- THƯ VIỆN HIỂN THỊ KỶ NIỆM -->
        <h2 class="section-title">SYSTEM MEMORIES</h2>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- MODAL ĐĂNG NHẬP ADMIN -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-box">
            <span class="close-modal" onclick="closeLoginModal()"><i class="fa-solid fa-xmark"></i></span>
            <h3>XÁC THỰC ADMIN</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label>Tài khoản:</label>
                    <input type="text" id="username" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 10px;">ĐĂNG NHẬP</button>
            </form>
        </div>
    </div>

    <script>
        // --- QUẢN LÝ CƠ SỞ DỮ LIỆU INDEXEDDB ---
        let db;
        const request = indexedDB.open("CyberMemoriesDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("memories")) {
                db.createObjectStore("memories", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            loadMemories();
        };

        // --- XỬ LÝ ĐĂNG NHẬP / ĐĂNG XUẤT ADMIN ---
        let isAdminLoggedIn = false;

        function toggleAuth() {
            if (isAdminLoggedIn) {
                // Đăng xuất
                isAdminLoggedIn = false;
                document.body.classList.remove('is-admin');
                document.getElementById('adminPanel').classList.remove('active');
                document.getElementById('authBtn').innerHTML = '<i class="fa-solid fa-lock"></i> Admin';
                alert("Đã đăng xuất khỏi quyền Admin!");
            } else {
                // Mở cửa sổ đăng nhập
                document.getElementById('loginModal').classList.add('active');
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        // Kiểm tra thông tin Đăng nhập
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // TÀI KHOẢN VÀ MẬT KHẨU MẶC ĐỊNH CHỖ NÀY
            if (user === 'admin' && pass === '123456') {
                isAdminLoggedIn = true;
                document.body.classList.add('is-admin');
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('authBtn').innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Thoát Admin';
                closeLoginModal();
                document.getElementById('loginForm').reset();
            } else {
                alert("Sai Tài khoản hoặc Mật khẩu!");
            }
        });

        // --- UPLOAD KỶ NIỆM MỚI ---
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fileInput = document.getElementById('mediaFile');
            const captionInput = document.getElementById('caption');
            const file = fileInput.files[0];

            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const memoryData = {
                    fileData: event.target.result,
                    fileType: file.type.startsWith('image') ? 'image' : 'video',
                    caption: captionInput.value,
                    date: new Date().toLocaleDateString('vi-VN', { 
                        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' 
                    })
                };

                const transaction = db.transaction(["memories"], "readwrite");
                const store = transaction.objectStore("memories");
                store.add(memoryData);

                transaction.oncomplete = function() {
                    document.getElementById('uploadForm').reset();
                    loadMemories();
                };
            };

            reader.readAsDataURL(file);
        });

        // --- HÀM TẢI KỶ NIỆM RA GIAO DIỆN ---
        function loadMemories() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';

            const transaction = db.transaction(["memories"], "readonly");
            const store = transaction.objectStore("memories");
            const getAllRequest = store.getAll();

            getAllRequest.onsuccess = function() {
                const memories = getAllRequest.result;

                if (memories.length === 0) {
                    galleryGrid.innerHTML = '<div class="empty-box"><i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i>Chưa có kỷ niệm nào được tải lên.</div>';
                    return;
                }

                memories.reverse().forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'memory-card';

                    let mediaHtml = item.fileType === 'image' 
                        ? `<img src="${item.fileData}" alt="Kỷ niệm">`
                        : `<video src="${item.fileData}" controls></video>`;

                    card.innerHTML = `
                        <button class="btn-delete" onclick="deleteMemory(${item.id})" title="Xóa kỷ niệm"><i class="fa-solid fa-trash"></i></button>
                        <div class="media-box">
                            ${mediaHtml}
                        </div>
                        <div class="memory-content">
                            <div class="memory-caption">${escapeHtml(item.caption)}</div>
                            <div class="memory-date"><i class="fa-regular fa-clock"></i> ${item.date}</div>
                        </div>
                    `;

                    galleryGrid.appendChild(card);
                });
            };
        }

        // --- XÓA KỶ NIỆM ---
        function deleteMemory(id) {
            if (confirm("Xác nhận xóa kỷ niệm này vĩnh viễn?")) {
                const transaction = db.transaction(["memories"], "readwrite");
                const store = transaction.objectStore("memories");
                store.delete(id);

                transaction.oncomplete = function() {
                    loadMemories();
                };
            }
        }

        // Đổi ký tự đặc biệt phòng tránh injection
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
